<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Al-Anwaar">
  <!--
    The Al-Anwaar mark, on its own, as the favicon.

    THE SHAPE is the dome and minaret lifted straight out of
    assets/images/Al-Anwaar-Logo-600x136.png — columns 1 to 126 of it, which is
    the mark with the wordmark left behind. It was traced from the artwork
    rather than redrawn, so this is the charity's own masjid and not an
    approximation: the two loops below are the buildings and the sweep beneath
    them, and the gap between them is the gap in the logo.

    THE COLOUR is #006770 — the logo's own teal, which is also --color-teal in
    index.css and the colour the previous site's favicon was drawn in. It was a
    45% tint of --color-green for one round and read as a grey smudge in a tab
    beside the old one. If this changes, change --color-teal with it.

    NO BACKGROUND, deliberately. This had a #f5f5f2 chip behind it, which on a
    dark tab bar is a pale sticker with a mark on it rather than a mark. The old
    favicon is fully transparent and is right to be: a favicon is composited
    onto whatever the browser's chrome happens to be, and a mark that carries
    its own ground can only ever match one of them. apple-touch-icon.png is the
    exception and keeps an opaque ground, because iOS fills a transparent touch
    icon with black.

    Square to the edges, because the browser rounds the corners itself.
  -->
