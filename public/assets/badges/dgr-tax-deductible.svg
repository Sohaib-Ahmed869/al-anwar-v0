<!-- The DGR seal (28 September 2026). The ATO publishes no logo for Deductible
     Gift Recipient status, so this is Al-Anwaar's own mark, drawn in the
     charity's green rather than the ACNC's teal so it never reads as a
     government badge. It is round and the same size as the official ACNC
     "Registered Charity" logo beside it, so the two sit as a pair. The .png
     next to it is this file rendered at 480px, for email. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Deductible Gift Recipient: donations of $2 or more are tax deductible">
  <defs>
    <path id="top" d="M 38 120 A 82 82 0 0 1 202 120" />
    <path id="bottom" d="M 30 120 A 90 90 0 0 0 210 120" />
  </defs>
  <circle cx="120" cy="120" r="116" fill="#ffffff" />
  <circle cx="120" cy="120" r="112" fill="none" stroke="#1d4a3e" stroke-width="6" />
  <circle cx="120" cy="120" r="66" fill="none" stroke="#1d4a3e" stroke-width="3" />
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2.5" fill="#1d4a3e">
    <textPath href="#top" startOffset="50%" text-anchor="middle">TAX DEDUCTIBLE</textPath>
  </text>
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#1d4a3e">
    <textPath href="#bottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">DONATIONS OF $2 OR MORE</textPath>
  </text>
  <circle cx="23" cy="120" r="4" fill="#c9a227" />
  <circle cx="217" cy="120" r="4" fill="#c9a227" />
  <circle cx="120" cy="120" r="60" fill="#1d4a3e" />
  <text x="120" y="126" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="1" fill="#ffffff">DGR</text>
  <rect x="94" y="136" width="52" height="2.5" rx="1.25" fill="#c9a227" />
  <text x="120" y="154" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing=".6" fill="#ffffff">DEDUCTIBLE GIFT</text>
  <text x="120" y="166" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing=".6" fill="#ffffff">RECIPIENT</text>
</svg>
